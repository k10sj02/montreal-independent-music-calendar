[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "montreal-independent-music-calendar"
version = "1.0.0"
description = "A subscribable calendar of independent and experimental music events in Montréal"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12", "httpx>=0.27", "icalendar>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
montreal-independent-music-calendar = "montreal_independent_music_calendar:main"

[tool.setuptools.packages.find]
where = ["src"]
